<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="45%" stop-color="#13407a"/>
      <stop offset="100%" stop-color="#2b9fff"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe9ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Badge -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#sky)"/>
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="120" cy="120" r="3.5"/>
    <circle cx="170" cy="96" r="2.2"/>
    <circle cx="392" cy="150" r="3"/>
    <circle cx="360" cy="110" r="2"/>
    <circle cx="110" cy="200" r="2"/>
  </g>

  <!-- Curved contrail (the "writing" stroke) -->
  <path d="M104 392 C 180 372, 196 300, 268 286 C 336 272, 360 224, 404 168"
        fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="2 30"/>

  <!-- Paper plane -->
  <g filter="url(#soft)">
    <path d="M392 132 L236 300 L300 318 L322 392 L356 300 Z" fill="url(#plane)"/>
    <path d="M392 132 L300 318 L322 392 L356 300 Z" fill="#9fd0ff" opacity="0.65"/>
    <path d="M392 132 L236 300 L300 318 Z" fill="#ffffff"/>
  </g>
</svg>
